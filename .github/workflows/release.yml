name: Publish Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/LexiLens.Core.Tests -c Release
      - name: Package
        shell: pwsh
        run: ./scripts/publish.ps1 -Version '${{ github.ref_name }}'
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ github.ref_name }}' artifacts/*.zip artifacts/SHA256SUMS.txt --verify-tag --title 'LexiLens ${{ github.ref_name }}' --notes-file docs/RELEASE_NOTES.md
